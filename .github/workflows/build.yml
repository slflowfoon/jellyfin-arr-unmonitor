name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - dotnet: 8.0.x
            framework: net8.0
            jellyfin: 10.10.0
          - dotnet: 9.0.x
            framework: net9.0
            jellyfin: 10.11.8
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: Test against Jellyfin ${{ matrix.jellyfin }}
        run: dotnet test tests/ArrUnmonitor.Tests/ArrUnmonitor.Tests.csproj --configuration Release -p:JellyfinControllerVersion=${{ matrix.jellyfin }} -p:TargetFramework=${{ matrix.framework }} -p:TargetFrameworks=${{ matrix.framework }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Sync project version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          perl -0pi -e 's|<Version>[^<]+</Version>|<Version>'"$VERSION"'.0</Version>|' ArrUnmonitor.csproj

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: dotnet publish --configuration Release --output ./publish -p:JellyfinControllerVersion=10.10.0 -p:TargetFramework=net8.0 -p:TargetFrameworks=net8.0

      - name: Package
        run: |
          cd publish
          zip -j ../ArrUnmonitor.zip ArrUnmonitor.dll

      - name: Compute checksum
        id: checksum
        run: echo "md5=$(md5sum ArrUnmonitor.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ArrUnmonitor.zip
          generate_release_notes: true

      - name: Update manifest
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${{ steps.version.outputs.version }}"
          CHECKSUM="${{ steps.checksum.outputs.md5 }}"
          REPO="${{ github.repository }}"
          URL="https://github.com/${REPO}/releases/download/${TAG}/ArrUnmonitor.zip"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          NEW_ENTRY=$(jq -n \
            --arg v "${VERSION}.0" \
            --arg url "$URL" \
            --arg md5 "$CHECKSUM" \
            --arg ts "$TIMESTAMP" \
            '{version:$v,changelog:"See GitHub release notes.",targetAbi:"10.10.0.0",sourceUrl:$url,checksum:$md5,timestamp:$ts}')

          jq --argjson entry "$NEW_ENTRY" \
            '.[0].versions = [$entry] + .[0].versions' \
            manifest.json > manifest.tmp && mv manifest.tmp manifest.json

      - name: Commit release metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json ArrUnmonitor.csproj
          git commit -m "Update release metadata for ${{ github.ref_name }}" || true
          git push origin HEAD:main || true
